name: CI Scorer

on:
  push:
    branches: [main, master]
    paths:
      - 'pallasbench/**'
      - 'scripts/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, master]
    paths:
      - 'pallasbench/**'
      - 'scripts/**'
      - 'pyproject.toml'

jobs:
  score:
    runs-on: ubuntu-latest
    name: Score PR kernel changes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run correctness scoring (CPU interpret mode)
        run: |
          python scripts/run_benchmark.py \
            --levels 1 2 3 \
            --size SMALL \
            --interpret \
            --output-dir results/
        env:
          JAX_PLATFORMS: cpu

      - name: Generate score report
        id: score
        run: |
          python -c "
          import json, glob
          files = sorted(glob.glob('results/pallasbench_*.json'))
          if files:
              with open(files[-1]) as f:
                  data = json.load(f)
              s = data['summary']
              report = f'''## PallasBench CI Score Report

          | Metric | Value |
          |--------|-------|
          | Total Tasks | {s['total_tasks']} |
          | Correct | {s['correct']} |
          | fast_0 (correctness) | {s['fast_0']:.1%} |
          | fast_1 (faster) | {s['fast_1']:.1%} |
          | fast_2 (2x faster) | {s['fast_2']:.1%} |
          | Mean Speedup | {s['mean_speedup']:.2f}x |
          | Median Speedup | {s['median_speedup']:.2f}x |

          > Tested on CPU with \`interpret=True\` (SMALL size). Performance numbers are indicative only.
          '''
              with open('score_report.md', 'w') as f:
                  f.write(report)
          "

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          header: pallasbench-score
          path: score_report.md
