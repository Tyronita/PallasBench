[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pallas-bench-dataset"
version = "0.1.0"
description = "PallasBench × SakanaAI CUDA-Engineer format — JAX/Pallas T4 kernel benchmark dataset"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "datasets>=2.18",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.5.0",
    "jaxlib[cuda12]>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "black",
    "ruff",
]

[project.scripts]
pb-run    = "scripts.run_benchmark:main"
pb-export = "scripts.export_dataset:main"
pb-show   = "scripts.analyze_results:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pallas_bench*", "scripts*"]
